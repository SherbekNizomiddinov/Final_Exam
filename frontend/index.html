<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Apple Magazin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar">
      <div class="container">
        <div class="nav-brand">Apple</div>
        <div class="nav-center">
          <input type="text" id="searchInput" class="search-input" placeholder="Search products..." />
        </div>
        <div class="nav-right">
          <span class="nav-link" id="profileBtn">Profil</span>
          <button id="themeToggle" class="theme-toggle" type="button">
            <span class="theme-icon">🌙</span>
            <span class="theme-text">Qorong'u</span>
          </button>
          

          <span class="nav-link" id="cartBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span id="cartCount" class="cart-count">0</span>
          </span>
          <span class="nav-link" id="logoutBtn">Chiqish</span>
        </div>
      </div>
    </nav>

    <!-- Main Container -->
    <main id="mainContent"></main>

    <!-- Auth Modal -->
    <div id="authModal" class="modal">
      <div class="modal-content auth-modal">
        <div class="modal-tabs">
          <button class="tab-btn active" data-tab="login">Kirish</button>
          <button class="tab-btn" data-tab="register">Ro'yhatdan o'tish</button>
        </div>

        <!-- Login Tab -->
        <div id="login" class="tab-content active">
          <h2>Kirish</h2>
          <form id="loginForm">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="loginEmail" required />
            </div>
            <div class="form-group">
              <label>Parol</label>
              <input type="password" id="loginPassword" required />
            </div>
            <button type="submit" class="btn btn-primary">Kirish</button>
          </form>
        </div>

        <!-- Register Tab -->
        <div id="register" class="tab-content">
          <h2>Ro'yhatdan o'tish</h2>
          <form id="registerForm">
            <div class="form-group">
              <label>Ism_Familya</label>
              <input type="text" id="registerName" required />
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="registerEmail" required />
            </div>
            <div class="form-group">
              <label>Parol</label>
              <input type="password" id="registerPassword" required />
            </div>
            <button type="submit" class="btn btn-primary">Ro'yhatdan o'tish</button>
          </form>
        </div>

        <!-- 2FA Verification -->
        <div id="twofa" class="tab-content">
          <h2>Parolni Tasdiqlash</h2>
          <form id="otpForm">
            <p>Emailga yuborilgan 6 xonali parolni kiriting</p>
            <div class="form-group">
              <label></label>
              <input type="text" id="otpInput" placeholder="000000" maxlength="6" required />
            </div>
            <button type="submit" class="btn btn-primary">Tasdiqlash</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Product Detail Modal -->
    <div id="productModal" class="modal">
      <div class="modal-content product-modal">
        <button class="modal-close">&times;</button>
        <div id="productDetail"></div>
      </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
      <div class="modal-content cart-modal">
        <button class="modal-close">&times;</button>
        <h2>Savatcha</h2>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-summary">
          <div class="summary-row">
            <span>Narxlari:</span>
            <span id="subtotal">$0</span>
          </div>
          <div class="summary-row">
            <span>Yuk narxi:</span>
            <span id="tax">$0</span>
          </div>
          <div class="summary-row total">
            <span>Barcha Summa:</span>
            <span id="total">$0</span>
          </div>
        </div>
        <button id="checkoutBtn" class="btn btn-primary">Tasdiqlash</button>
      </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal">
      <div class="modal-content checkout-modal">
        <button class="modal-close">&times;</button>
        <div class="checkout-steps">
          <div class="step active" data-step="address">
            <h3>Manzil</h3>
          </div>
          <div class="step" data-step="shipping">
            <h3>Yuk Turi</h3>
          </div>
          <div class="step" data-step="payment">
            <h3>To'lov</h3>
          </div>
        </div>

        <!-- Address Step -->
        <div id="addressStep" class="checkout-step active">
          <form id="addressForm">
            <div class="form-group">
              <label>Ko'cha manzili:</label>
              <input type="text" id="street" required />
            </div>
            <div class="form-group">
              <label>Shahar:</label>
              <input type="text" id="city" required />
            </div>
            <div class="form-group">
              <label>Mahalla:</label>
              <input type="text" id="state" required />
            </div>
            <div class="form-group">
              <label>Pochta Kodi:</label>
              <input type="text" id="zip" required />
            </div>
            <button type="button" class="btn btn-primary" id="nextShippingBtn">Keyingisi</button>
          </form>
        </div>

        <!-- Shipping Step -->
        <div id="shippingStep" class="checkout-step">
          <form id="shippingForm">
            <div class="shipping-options">
              <label class="radio-option">
                <input type="radio" name="shipping" value="free" checked />
                <span class="radio-custom"></span>
                <span>Bepul yuk - ish kuni 5-7</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="shipping" value="express" />
                <span class="radio-custom"></span>
                <span>Ekspres yetkazib berish - 2-3 ish kuni(+$15)</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="shipping" value="overnight" />
                <span class="radio-custom"></span>
                <span>Kechasi yetkazib berish - Keyingi kun (+$50)</span>
              </label>
            </div>
            <button type="button" class="btn btn-primary" id="nextPaymentBtn">To'lovga O'tish</button>
          </form>
        </div>

        <!-- Payment Step -->
        <div id="paymentStep" class="checkout-step">
          <form id="paymentForm">
            <div class="form-group">
              <label>Karta Raqam:</label>
              <input type="text" id="cardNumber" placeholder="4532 1234 5678 9010" maxlength="19" required />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>AQM</label>
                <input type="text" id="expDate" placeholder="MM/YY" maxlength="5" required />
              </div>
              <div class="form-group">
                <label>CVV</label>
                <input type="text" id="cvv" placeholder="123" maxlength="3" required />
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Rasmiylashtrish</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="modal">
      <div class="modal-content profile-modal">
        <button class="modal-close">&times;</button>
        <h2>Profilim</h2>
        <div id="profileContent" class="profile-content"></div>
      </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script src="app.js"></script>
  </body>
</html>
