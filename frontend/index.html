<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber - Apple Store</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar">
      <div class="container">
        <div class="nav-brand">Apple</div>
        <div class="nav-center">
          <input type="text" id="searchInput" class="search-input" placeholder="Search products..." />
        </div>
        <div class="nav-right">
          <span class="nav-link" id="profileBtn">Profile</span>
          <span class="nav-link" id="cartBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span id="cartCount" class="cart-count">0</span>
          </span>
          <span class="nav-link" id="logoutBtn">Logout</span>
        </div>
      </div>
    </nav>

    <!-- Main Container -->
    <main id="mainContent"></main>

    <!-- Auth Modal -->
    <div id="authModal" class="modal">
      <div class="modal-content auth-modal">
        <div class="modal-tabs">
          <button class="tab-btn active" data-tab="login">Login</button>
          <button class="tab-btn" data-tab="register">Register</button>
        </div>

        <!-- Login Tab -->
        <div id="login" class="tab-content active">
          <h2>Login</h2>
          <form id="loginForm">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="loginEmail" required />
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="loginPassword" required />
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
          </form>
        </div>

        <!-- Register Tab -->
        <div id="register" class="tab-content">
          <h2>Register</h2>
          <form id="registerForm">
            <div class="form-group">
              <label>Name</label>
              <input type="text" id="registerName" required />
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="registerEmail" required />
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="registerPassword" required />
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
          </form>
        </div>

        <!-- 2FA Verification -->
        <div id="twofa" class="tab-content">
          <h2>Verify OTP</h2>
          <form id="otpForm">
            <p>Enter the 6-digit OTP sent to your email</p>
            <div class="form-group">
              <label>OTP</label>
              <input type="text" id="otpInput" placeholder="000000" maxlength="6" required />
            </div>
            <button type="submit" class="btn btn-primary">Verify</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Product Detail Modal -->
    <div id="productModal" class="modal">
      <div class="modal-content product-modal">
        <button class="modal-close">&times;</button>
        <div id="productDetail"></div>
      </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
      <div class="modal-content cart-modal">
        <button class="modal-close">&times;</button>
        <h2>Shopping Cart</h2>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-summary">
          <div class="summary-row">
            <span>Subtotal:</span>
            <span id="subtotal">$0</span>
          </div>
          <div class="summary-row">
            <span>Tax:</span>
            <span id="tax">$0</span>
          </div>
          <div class="summary-row total">
            <span>Total:</span>
            <span id="total">$0</span>
          </div>
        </div>
        <button id="checkoutBtn" class="btn btn-primary">Proceed to Checkout</button>
      </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal">
      <div class="modal-content checkout-modal">
        <button class="modal-close">&times;</button>
        <div class="checkout-steps">
          <div class="step active" data-step="address">
            <h3>Address</h3>
          </div>
          <div class="step" data-step="shipping">
            <h3>Shipping</h3>
          </div>
          <div class="step" data-step="payment">
            <h3>Payment</h3>
          </div>
        </div>

        <!-- Address Step -->
        <div id="addressStep" class="checkout-step active">
          <form id="addressForm">
            <div class="form-group">
              <label>Street Address</label>
              <input type="text" id="street" required />
            </div>
            <div class="form-group">
              <label>City</label>
              <input type="text" id="city" required />
            </div>
            <div class="form-group">
              <label>State</label>
              <input type="text" id="state" required />
            </div>
            <div class="form-group">
              <label>Zip Code</label>
              <input type="text" id="zip" required />
            </div>
            <button type="button" class="btn btn-primary" id="nextShippingBtn">Next: Shipping</button>
          </form>
        </div>

        <!-- Shipping Step -->
        <div id="shippingStep" class="checkout-step">
          <form id="shippingForm">
            <div class="shipping-options">
              <label class="radio-option">
                <input type="radio" name="shipping" value="free" checked />
                <span class="radio-custom"></span>
                <span>Free Shipping - 5-7 business days</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="shipping" value="express" />
                <span class="radio-custom"></span>
                <span>Express Shipping - 2-3 business days (+$15)</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="shipping" value="overnight" />
                <span class="radio-custom"></span>
                <span>Overnight Shipping - Next day (+$50)</span>
              </label>
            </div>
            <button type="button" class="btn btn-primary" id="nextPaymentBtn">Next: Payment</button>
          </form>
        </div>

        <!-- Payment Step -->
        <div id="paymentStep" class="checkout-step">
          <form id="paymentForm">
            <div class="form-group">
              <label>Card Number</label>
              <input type="text" id="cardNumber" placeholder="4532 1234 5678 9010" maxlength="19" required />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Exp Date</label>
                <input type="text" id="expDate" placeholder="MM/YY" maxlength="5" required />
              </div>
              <div class="form-group">
                <label>CVV</label>
                <input type="text" id="cvv" placeholder="123" maxlength="3" required />
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Complete Order</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="modal">
      <div class="modal-content profile-modal">
        <button class="modal-close">&times;</button>
        <h2>My Profile</h2>
        <div id="profileContent" class="profile-content"></div>
      </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script src="app.js"></script>
  </body>
</html>
